<div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>

<div class="equipo-header">
  <h1 style="font-size:22px;font-weight:800;margin:0 0 4px" id="hub-greeting">Buen día, equipo 🌿</h1>
  <div style="font-size:13px;opacity:0.75">Club Sugar · Lunes 11 Nov 2026</div>
  <div style="margin-top:12px;display:flex;gap:8px">
    <span class="p-chip ok" style="font-size:11px">🟢 Club abierto</span>
    <span class="live-pulse" style="font-size:11px">3 pedidos activos</span>
  </div>
</div>

<div style="padding:20px 16px;flex:1;background:#060E0A">
  <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:rgba(82,183,136,0.6);font-weight:700;margin-bottom:14px">Acceso rápido por rol</div>
  <div id="hub-cards"></div>
  <div style="margin-top:16px;padding:14px;background:rgba(255,255,255,0.04);border:1px solid rgba(82,183,136,0.15);border-radius:14px;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:10px" id="hub-user-info"></div>
    <div style="display:flex;align-items:center;gap:10px">
      <a href="index.html" style="font-size:11px;color:rgba(82,183,136,0.7);text-decoration:none">← Portales</a>
      <span style="color:rgba(255,255,255,0.15);font-size:12px">|</span>
      <a href="#" id="btn-logout" style="font-size:11px;color:rgba(220,80,80,0.6);text-decoration:none">Salir</a>
    </div>
  </div>
</div>

<script>
(function(){
  const raw = sessionStorage.getItem('eq_user');
  if(!raw && window.__portalGoTo){ window.__portalGoTo('equipo-login'); return; }
  const user = raw ? JSON.parse(raw) : { name:'Tomás García', initials:'TG', color:'gold', role:'Admin · Club Sugar', perms:['admision','armado','entrega','medico','fichaje'] };

  const CARDS = [
    { perm:'admision', goto:'equipo-admision', icon:'🚪', title:'Admisión',           sub:'Candidatos y pipeline · guiá a nuevos socios',   badge:'7 activos',              bs:'' },
    { perm:'armado',   goto:'equipo-armado',   icon:'📦', title:'Armado de pedidos',   sub:'Preparar los pedidos en el club',                badge:'7 pendientes',           bs:'' },
    { perm:'entrega',  goto:'equipo-entrega',  icon:'🤝', title:'Entregas y retiros',  sub:'Listos para que el socio retire',                badge:'2 listos · 3 armando',   bs:'' },
    { perm:'medico',   goto:'equipo-medico',   icon:'🩺', title:'Sesiones médicas',    sub:'Consultas Zoom pendientes de aprobación',        badge:'2 consultas',  bs:'background:rgba(139,92,246,0.15);color:#A78BFA' },
    { perm:'fichaje',  goto:'equipo-fichaje',  icon:'🎫', title:'Mi QR de fichaje',   sub:'Mostrá tu código en el lector de entrada',      badge:'',             bs:'background:rgba(14,165,233,0.12);color:#38BDF8' },
  ];

  const initials = user.initials || user.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const firstName = user.name.split(' ')[0];

  const cardsHtml = CARDS
    .filter(c => user.perms.includes(c.perm))
    .map(c => `<div class="equipo-role-card" data-goto="${c.goto}">
      <div class="equipo-role-icon">${c.icon}</div>
      <div class="equipo-role-main">
        <div class="equipo-role-title">${c.title}</div>
        <div class="equipo-role-sub">${c.sub}</div>
      </div>
      ${c.badge ? `<div class="equipo-role-badge" ${c.bs ? `style="${c.bs}"` : ''}>${c.badge}</div>` : ''}
    </div>`).join('');

  document.getElementById('hub-greeting').textContent = `Buen día, ${firstName} 🌿`;
  document.getElementById('hub-cards').innerHTML = cardsHtml;

  document.getElementById('hub-cards').querySelectorAll('[data-goto]').forEach(el => {
    el.addEventListener('click', () => { if(window.__portalGoTo) window.__portalGoTo(el.dataset.goto); });
  });

  document.getElementById('hub-user-info').innerHTML = `
    <div class="p-avatar ${user.color || 'mint'} sm">${initials}</div>
    <div>
      <div style="font-size:13px;font-weight:700;color:white">${user.name}</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.4)">${user.role} · Club Sugar</div>
    </div>`;

  document.getElementById('btn-logout').addEventListener('click', e => {
    e.preventDefault();
    sessionStorage.removeItem('eq_user');
    if(window.__portalGoTo) window.__portalGoTo('equipo-login');
  });
})();
</script>
